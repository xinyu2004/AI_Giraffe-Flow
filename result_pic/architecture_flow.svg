<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 580" width="680" height="580" role="img" aria-label="Giraffe Flow architecture: gf-config to board with EM to GMT">
  <defs>
    <marker id="ah-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="ah-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c62828"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#78909c"/>
    </marker>
    <style><![CDATA[
      .box { fill:#fff8e1; stroke:#f9a825; stroke-width:2; }
      .brand { font:700 18px ui-sans-serif,system-ui,sans-serif; fill:#5d4037; }
      .tag { font:12px ui-sans-serif,system-ui,sans-serif; fill:#6d4c41; }
      .muted { font:11px ui-sans-serif,system-ui,sans-serif; fill:#6d4c41; }
      .small { font:11px ui-monospace,Menlo,monospace; fill:#37474f; }
      .tab { fill:#fffde7; stroke:#ffb300; stroke-width:1; }
      .tab-t { font:700 12px ui-sans-serif,system-ui,sans-serif; fill:#e65100; }
      .board { fill:#1b2a24; stroke:#c9a227; stroke-width:2; }
      .board-title { font:700 15px ui-sans-serif,system-ui,sans-serif; fill:#ffe082; }
      .board-text { font:12px ui-sans-serif,system-ui,sans-serif; fill:#c8e6c9; }
      .inner { fill:#0f3d36; stroke:#26a69a; stroke-width:1.5; }
      .inner-t { font:11px ui-monospace,Menlo,monospace; fill:#b2dfdb; }
      .inner-apps { fill:#3e2723; stroke:#ff8a65; stroke-width:1.5; }
      .inner-apps-t { font:11px ui-monospace,Menlo,monospace; fill:#ffccbc; }
      .gmt { fill:#e3f2fd; stroke:#1565c0; stroke-width:2.5; }
      .gmt-brand { font:700 18px ui-sans-serif,system-ui,sans-serif; fill:#0d47a1; }
      .gmt-sub { font:12px ui-sans-serif,system-ui,sans-serif; fill:#1565c0; }
      .pin { fill:#c9a227; }
      .flow-down { fill:none; stroke:#2e7d32; stroke-width:2.2; marker-end:url(#ah-down); }
      .flow-up { fill:none; stroke:#c62828; stroke-width:2.2; marker-end:url(#ah-up); }
      .flow-gray { fill:none; stroke:#78909c; stroke-width:1.6; marker-end:url(#ah-gray); }
      .badge { fill:#f9a825; }
      .badge-t { font:700 10px ui-sans-serif,system-ui,sans-serif; fill:#3e2723; }
    ]]></style>
  </defs>

  <rect class="box" x="70" y="8" width="540" height="112" rx="8"/>
  <text class="brand" x="340" y="36" text-anchor="middle">gf-config</text>
  <text class="tag" x="340" y="56" text-anchor="middle">configure the vehicle contract — wiring, trim, middleware tables</text>
  <rect class="tab" x="90" y="66" width="240" height="34" rx="5"/>
  <text class="tab-t" x="102" y="80">Connect signals &amp; apps</text>
  <text class="muted" x="102" y="94">wiring canvas · SKU / live_tap</text>
  <rect class="tab" x="350" y="66" width="240" height="34" rx="5"/>
  <text class="tab-t" x="362" y="80">Configure middleware</text>
  <text class="muted" x="362" y="94">trim modules · fill exec / EM / PHM …</text>

  <line class="flow-gray" x1="340" y1="120" x2="340" y2="142"/>
  <text class="muted" x="356" y="136">compose → flash / build</text>

  <rect class="board" x="80" y="148" width="520" height="246" rx="10"/>
  <g class="pin"><rect x="68" y="168" width="12" height="8" rx="1"/><rect x="600" y="168" width="12" height="8" rx="1"/><rect x="68" y="192" width="12" height="8" rx="1"/><rect x="600" y="192" width="12" height="8" rx="1"/><rect x="68" y="216" width="12" height="8" rx="1"/><rect x="600" y="216" width="12" height="8" rx="1"/><rect x="68" y="240" width="12" height="8" rx="1"/><rect x="600" y="240" width="12" height="8" rx="1"/><rect x="68" y="264" width="12" height="8" rx="1"/><rect x="600" y="264" width="12" height="8" rx="1"/><rect x="68" y="288" width="12" height="8" rx="1"/><rect x="600" y="288" width="12" height="8" rx="1"/><rect x="68" y="312" width="12" height="8" rx="1"/><rect x="600" y="312" width="12" height="8" rx="1"/><rect x="68" y="336" width="12" height="8" rx="1"/><rect x="600" y="336" width="12" height="8" rx="1"/><rect x="68" y="360" width="12" height="8" rx="1"/><rect x="600" y="360" width="12" height="8" rx="1"/></g>
  <text class="board-title" x="340" y="176" text-anchor="middle">GIRAFFE MODULES</text>
  <text class="board-text" x="340" y="196" text-anchor="middle" font-size="11">SIL / HIL · BOARD · EM topo-spawns via OSAL</text>

  <rect class="inner" x="110" y="210" width="460" height="72" rx="6"/>
  <text class="inner-t" x="126" y="228" fill="#80cbc4">SoC · middleware / gf_ara (SKU-trimmable)</text>
  <text class="inner-t" x="126" y="246">com · EM · exec · phm · sm · collector · OSAL · diag</text>
  <text class="inner-t" x="126" y="264">bindings: iceoryx | SOME/IP | DDS · process Spawn</text>

  <rect class="inner-apps" x="110" y="294" width="460" height="72" rx="6"/>
  <text class="inner-apps-t" x="126" y="314" fill="#ffab91">SOA apps · launched by EM</text>
  <text class="inner-apps-t" x="126" y="332">gateway · sensing · perception · planning</text>
  <text class="inner-apps-t" x="126" y="350">pub/sub service names — OEM swap keeps the contract</text>

  <path class="flow-down" d="M220 394 L220 422" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <text class="small" x="232" y="412" fill="#2e7d32">tap / observe</text>
  <path class="flow-up" d="M460 422 L460 394" stroke-dasharray="8 6">
    <animate attributeName="stroke-dashoffset" from="0" to="-28" dur="1.1s" repeatCount="indefinite"/>
  </path>
  <text class="small" x="472" y="412" fill="#c62828">inject / drive</text>

  <rect class="gmt" x="70" y="430" width="540" height="138" rx="8"/>
  <text class="gmt-brand" x="340" y="454" text-anchor="middle">GMT</text>
  <text class="gmt-sub" x="340" y="472" text-anchor="middle">host tool · observe / inject</text>
  <text class="small" x="100" y="494">· Live ws (8766)</text>
  <text class="small" x="360" y="494">· Order / race</text>
  <text class="small" x="100" y="512">· Animated DAG</text>
  <text class="small" x="360" y="512">· Graphics</text>
  <text class="small" x="100" y="530">· Tag / clip</text>
  <text class="small" x="360" y="530">· MCAP · VCD export</text>
  <text class="small" x="100" y="548">· Foxglove (8765)</text>
  <text class="small" x="360" y="548">· playhead inject (8767)</text>
</svg>
