<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 700" width="680" height="700" role="img" aria-label="Giraffe Flow: gf-config → Giraffe modules (incl. FuSa) → GMT">
  <defs>
    <marker id="ah-down" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#2e7d32"/>
    </marker>
    <marker id="ah-up" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c62828"/>
    </marker>
    <marker id="ah-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#78909c"/>
    </marker>
    <style><![CDATA[
      .box { fill:#fff8e1; stroke:#f9a825; stroke-width:2; }
      .brand { font:700 18px ui-sans-serif,system-ui,sans-serif; fill:#5d4037; }
      .tag { font:500 12px ui-sans-serif,system-ui,sans-serif; fill:#6d4c41; }
      .muted { font:500 11px ui-sans-serif,system-ui,sans-serif; fill:#6d4c41; }
      .small { font:500 11px ui-monospace,Menlo,monospace; fill:#37474f; }
      .tab { fill:#fffde7; stroke:#ffb300; stroke-width:1; }
      .tab-t { font:700 14px ui-sans-serif,system-ui,sans-serif; fill:#e65100; }
      .board { fill:#1b2a24; stroke:#c9a227; stroke-width:2; }
      .board-title { font:700 15px ui-sans-serif,system-ui,sans-serif; fill:#ffe082; }
      .board-text { font:500 12px ui-sans-serif,system-ui,sans-serif; fill:#c8e6c9; }
      .inner { fill:#0f3d36; stroke:#26a69a; stroke-width:1.5; }
      .inner-t { font:500 11px ui-monospace,Menlo,monospace; fill:#b2dfdb; }
      .inner-apps { fill:#3e2723; stroke:#ff8a65; stroke-width:1.5; }
      .inner-apps-t { font:500 11px ui-monospace,Menlo,monospace; fill:#ffccbc; }
      .fusa { fill:#1b3328; stroke:#66bb6a; stroke-width:1.5; }
      .fusa-t { font:700 12px ui-sans-serif,system-ui,sans-serif; fill:#a5d6a7; }
      .fusa-s { font:500 11px ui-monospace,Menlo,monospace; fill:#c8e6c9; }
      .planned { font:500 10px ui-sans-serif,system-ui,sans-serif; fill:#90a4ae; }
      .gmt { fill:#e3f2fd; stroke:#1565c0; stroke-width:2.5; }
      .gmt-brand { font:700 18px ui-sans-serif,system-ui,sans-serif; fill:#0d47a1; }
      .gmt-sub { font:500 12px ui-sans-serif,system-ui,sans-serif; fill:#1565c0; }
      .pin { fill:#c9a227; }
      .flow-down { fill:none; stroke:#2e7d32; stroke-width:2.5; marker-end:url(#ah-down); }
      .flow-up { fill:none; stroke:#c62828; stroke-width:2.5; marker-end:url(#ah-up); }
      .flow-gray { fill:none; stroke:#78909c; stroke-width:1.6; marker-end:url(#ah-gray); }
    ]]></style>
  </defs>

  <rect class="box" x="70" y="8" width="540" height="100" rx="8"/>
  <text class="brand" x="340" y="34" text-anchor="middle">gf-config</text>
  <text class="tag" x="340" y="52" text-anchor="middle">configure the vehicle contract — wiring, trim, middleware tables</text>
  <rect class="tab" x="90" y="62" width="240" height="34" rx="5"/>
  <text class="tab-t" x="102" y="76">Connect signals &amp; apps</text>
  <text class="muted" x="102" y="90">wiring canvas · SKU / live_tap</text>
  <rect class="tab" x="350" y="62" width="240" height="34" rx="5"/>
  <text class="tab-t" x="362" y="76">Configure middleware</text>
  <text class="muted" x="362" y="90">trim modules · fill exec / EM / PHM …</text>

  <line class="flow-gray" x1="340" y1="108" x2="340" y2="128"/>
  <text class="muted" x="356" y="122">compose → flash / build</text>

  <rect class="board" x="80" y="132" width="520" height="350" rx="10"/>
  <g class="pin">
    <rect x="56" y="146" width="24" height="14" rx="2"/><rect x="600" y="146" width="24" height="14" rx="2"/>
    <rect x="56" y="174" width="24" height="14" rx="2"/><rect x="600" y="174" width="24" height="14" rx="2"/>
    <rect x="56" y="202" width="24" height="14" rx="2"/><rect x="600" y="202" width="24" height="14" rx="2"/>
    <rect x="56" y="230" width="24" height="14" rx="2"/><rect x="600" y="230" width="24" height="14" rx="2"/>
    <rect x="56" y="258" width="24" height="14" rx="2"/><rect x="600" y="258" width="24" height="14" rx="2"/>
    <rect x="56" y="286" width="24" height="14" rx="2"/><rect x="600" y="286" width="24" height="14" rx="2"/>
    <rect x="56" y="314" width="24" height="14" rx="2"/><rect x="600" y="314" width="24" height="14" rx="2"/>
    <rect x="56" y="342" width="24" height="14" rx="2"/><rect x="600" y="342" width="24" height="14" rx="2"/>
    <rect x="56" y="370" width="24" height="14" rx="2"/><rect x="600" y="370" width="24" height="14" rx="2"/>
    <rect x="56" y="398" width="24" height="14" rx="2"/><rect x="600" y="398" width="24" height="14" rx="2"/>
    <rect x="56" y="426" width="24" height="14" rx="2"/><rect x="600" y="426" width="24" height="14" rx="2"/>
    <rect x="56" y="454" width="24" height="14" rx="2"/><rect x="600" y="454" width="24" height="14" rx="2"/>
  </g>
  <text class="board-title" x="340" y="154" text-anchor="middle">GIRAFFE MODULES</text>
  <text class="board-text" x="340" y="178" text-anchor="middle" font-size="11">runs on  ·  SIL / HIL · BOARD  ·  product core</text>
  <text class="board-text" x="340" y="202" text-anchor="middle" font-size="11">ARM · MIPS · RISC-V · …</text>
  <text class="board-text" x="340" y="220" text-anchor="middle" font-size="10">what actually runs — EM topo-spawns apps via OSAL</text>

  <rect class="inner" x="110" y="236" width="460" height="78" rx="6"/>
  <text class="inner-t" x="126" y="258" fill="#80cbc4">SoC · middleware / gf_ara  (SKU-trimmable)</text>
  <text class="inner-t" x="126" y="280">com · EM · exec · phm · sm · collector · OSAL · diag · ucm · log · per · tsync</text>
  <text class="inner-t" x="126" y="300">com → iceoryx | SOME/IP | DDS · OSAL process · platform below</text>

  <rect class="inner-apps" x="110" y="326" width="460" height="72" rx="6"/>
  <text class="inner-apps-t" x="126" y="346" fill="#ffab91">SOA apps · launched by EM (topo order)</text>
  <text class="inner-apps-t" x="126" y="364">gateway · sensing · perception · planning</text>
  <text class="inner-apps-t" x="126" y="382">Apps pub/sub service names only — OEM swap keeps the contract</text>

  <rect class="fusa" x="110" y="410" width="460" height="54" rx="6"/>
  <text class="fusa-t" x="126" y="432">FuSa  → Safety Case</text>
  <text class="fusa-s" x="126" y="452">POLICY · cases · metrics · safety-case · packs</text>

  <path class="flow-down" d="M220 482 L220 506"/>
  <text class="small" x="232" y="498" fill="#2e7d32">tap / observe</text>
  <path class="flow-up" d="M460 506 L460 482"/>
  <text class="small" x="472" y="498" fill="#c62828">inject / drive</text>

  <rect class="gmt" x="70" y="514" width="540" height="150" rx="8"/>
  <text class="gmt-brand" x="340" y="538" text-anchor="middle">GMT</text>
  <text class="gmt-sub" x="340" y="556" text-anchor="middle">host tool · observe / inject  (debug-path · not board ASIL evidence)</text>
  <text class="small" x="100" y="578">· Live ws (8766)</text>
  <text class="small" x="360" y="578">· Order / race</text>
  <text class="small" x="100" y="594">· Animated DAG</text>
  <text class="small" x="360" y="594">· Graphics</text>
  <text class="small" x="100" y="610">· Tag / clip</text>
  <text class="small" x="360" y="610">· MCAP · VCD export</text>
  <text class="small" x="100" y="626">· Foxglove (8765)</text>
  <text class="small" x="360" y="626">· playhead inject (8767)</text>
  <text class="small" x="100" y="642">· OTA</text>
  <text class="small" x="360" y="642">· DoIP</text>
</svg>
