# OEM A — AFC 前视（无 USS）· P3-5 Perception_* SIL
schema_version: '0.1'
profile: vehicle-debug
variant: afc_front_camera
topology: ap_only
product: AFC
capabilities:
- front_camera
- driving
runtime_modules:
- core
- com
- osal
- log
- exec
- phm
- sm
- collector
- ucm
- diag
- per
- tsync
bindings:
- iceoryx
observability:
  live_tap:
    enabled: true
    mode: wiring_all
  record:
    mode: minimal
    services:
    - services.semantic.EgoMotion
    - services.semantic.Perception_MESSAGE_Out_St
    - services.semantic.DrivingTrajectory
# Behavior freeze (gf-config → compose → compile). Not a runtime camera JSON.
frame_ingest:
  frame_source: carla_file
  pixel_format: nv12
  ego_source: carla
  frame_w: 2048
  frame_h: 1536
  camera_transport: shm
  # SOP freeze default; SIL overrides via GF_FRAME_SOURCE=carla|replay|colorbar
  active_source: isp
  camera_slots:
  - id: front
    w: 2048
    h: 1536
    pixel_format: nv12
    fps: 30
    mount:
      id: front
      x: 0.55
      y: 0.0
      z: 1.35
      pitch: -5.0
      yaw: 0.0
      roll: 0.0
      fov: 100.0
  bridge:
    enabled: true
  channels:
    vehicle_state: gf.channel.vehicle_state
    vehicle_cmd: gf.channel.vehicle_cmd
    fake_perc: gf.channel.fake_perc
apps:
- adapters/vehicle_can_gateway
- perception/fcm
- planning/driving
- frame_ingest
- frame_colorbar
- frame_replay
- carla_io
acceptance:
  description: AFC 无 USS — Perception_* + DrivingTrajectory + frame_ingest（默认 C dry-run）
  lineage_required: true
  required_services:
  - services.semantic.EgoMotion
  - services.semantic.Perception_In_St
  - services.semantic.Perception_MESSAGE_Out_St
  - services.semantic.DrivingTrajectory
  - services.semantic.VehicleBus
publish_policy:
  services:
    EgoMotion: { trigger: period, period_ms: 10 }
    Perception_In_St: { trigger: period, period_ms: 10 }
    VehicleBus: { trigger: period, period_ms: 10 }
    Perception_MESSAGE_Out_St: { trigger: on_change, expect_fps: 20 }
    DrivingTrajectory: { trigger: on_change }
  channels:
    vehicle_cmd: { trigger: period, period_ms: 10 }  # + Traj edge extra tick (AEB); not freeze
    vehicle_state: { trigger: on_change }
    fake_perc: { trigger: on_change }
