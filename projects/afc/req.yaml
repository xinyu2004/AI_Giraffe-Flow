# OEM A — AFC 前视（无 USS）· P3-5 Perception_* SIL
schema_version: '0.1'
profile: vehicle-debug
variant: afc_front_camera
topology: ap_only
product: AFC
capabilities:
- front_camera
- driving
runtime_modules:
- core
- com
- osal
- log
- exec
- phm
- sm
- collector
- ucm
- diag
- per
- tsync
bindings:
- iceoryx
observability:
  live_tap:
    enabled: true
    mode: wiring_all
  record:
    mode: minimal
    services:
    - services.semantic.EgoMotion
    - services.semantic.Perception_MESSAGE_Out_St
    - services.semantic.Trajectory
# Behavior freeze (gf-config → compose → compile). Not a runtime camera JSON.
frame_ingest:
  frame_source: carla_file
  pixel_format: nv12
  ego_source: carla
  frame_w: 640
  frame_h: 480
  camera_transport: shm
  # SOP freeze default; SIL overrides via GF_FRAME_SOURCE=carla|replay|colorbar
  active_source: isp
  camera_slots:
  - id: front
    w: 640
    h: 480
    pixel_format: nv12
  bridge:
    enabled: true
  channels:
    vehicle_state: gf.channel.vehicle_state
    vehicle_cmd: gf.channel.vehicle_cmd
    fake_perc: gf.channel.fake_perc
apps:
- adapters/vehicle_can_gateway
- perception/fcm
- planning/driving
- frame_ingest
- frame_colorbar
- frame_replay
- carla_io
acceptance:
  description: AFC 无 USS — Perception_* + Trajectory + frame_ingest（默认 C dry-run）
  lineage_required: true
  required_services:
  - services.semantic.EgoMotion
  - services.semantic.Perception_In_St
  - services.semantic.Perception_MESSAGE_Out_St
  - services.semantic.Trajectory
  - services.semantic.VehicleBus
# Phase-2 backlog (not enforced yet):
# publish_policy:
#   EgoMotion: { trigger: period, period_ms: 10 }
#   Perception_In_St: { trigger: on_change, watch: [speed_mps, gear, yaw_rate] }
#   vehicle_cmd: { trigger: period, period_ms: 10 }  # SIL egress; CAN-like
