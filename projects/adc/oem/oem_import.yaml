# ADC 空槽 — OEM 导入未采。
schema_version: "0.1.0"
project_id: adc
topology_default: ap_only

sources:
  - id: vehicle_can_dbc
    kind: dbc
    path: oem_import.dbc
    source_origin: null
    bus_id: vehicle_can
    nodes: []
    gateway:
      process: adapter.vehicle_can_gateway
      provides: []

extraction:
  dbc:
    exclude_name_patterns:
      - "VECTOR__*"
    include_messages: []

output:
  fragment_id: adc_can
  sections: [imports_meta]
  merge_policy: overlay
