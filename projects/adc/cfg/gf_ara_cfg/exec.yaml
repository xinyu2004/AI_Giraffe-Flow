# exec + SM — ADC
# MachineFG: always-on platform + perception + mode + gateway
# DriveParkFG: ModeDeclaration states DrivingActive / ParkingActive (EM set-diff via active_in)
schema_version: "0.1"
function_groups:
  - id: MachineFG
    kind: machine
    initial: Running
  - id: DriveParkFG
    kind: mode
    initial: DrivingActive
    states: [DrivingActive, ParkingActive]
processes:
  - name: host.dlt_daemon
    function_group: MachineFG
    depends_on: []
    execution_client: false
  - name: host.iox_roudi
    function_group: MachineFG
    depends_on:
      - host.dlt_daemon
    execution_client: false
  - name: host.frame_ingest
    function_group: MachineFG
    depends_on:
      - host.iox_roudi
    execution_client: false
  - name: adapter.vehicle_can_gateway
    function_group: MachineFG
    depends_on:
      - host.iox_roudi
    execution_client: true
  - name: perception.fcm
    function_group: MachineFG
    depends_on:
      - adapter.vehicle_can_gateway
      - host.frame_ingest
    execution_client: true
  - name: perception.surround
    function_group: MachineFG
    depends_on:
      - adapter.vehicle_can_gateway
    execution_client: true
  - name: mode.drive_park
    function_group: MachineFG
    depends_on:
      - adapter.vehicle_can_gateway
    execution_client: true
  - name: planning.driving
    function_group: DriveParkFG
    active_in: [DrivingActive]
    depends_on:
      - perception.fcm
      - mode.drive_park
    execution_client: true
  - name: planning.parking
    function_group: DriveParkFG
    active_in: [ParkingActive]
    depends_on:
      - perception.surround
      - mode.drive_park
    execution_client: true
