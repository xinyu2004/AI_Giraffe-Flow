# Event Collector + DEM-lite（非 Classic DEM）
# event 键必须与 ReportEvent 的 event_id 一致（AliveMissed / ota_failed …）
schema_version: "0.1"
forward: local_store  # cp_dem | local_store | both
sources:
  - phm
  - process
  - com
  - ucm
local:
  enabled: true
  max_entries: 256
  # BL-MEM-BOUND: debounce maps + shared NDJSON file
  debounce_max_keys: 64
  store_max_bytes: 1048576
# event_id → DTC（防抖 / FDC / 老化数值）
dtc_map:
  - event: AliveMissed
    dtc: 0xC01234
    debounce_count: 1
    fdc_threshold: 1
    aging_cycles: 40
  - event: DeadlineMissed
    dtc: 0xC01235
    debounce_count: 1
    fdc_threshold: 1
    aging_cycles: 40
  - event: ota_failed
    dtc: 0xC0A001
    debounce_count: 1
    fdc_threshold: 1
    aging_cycles: 40
  # LC P2 — planning.driving_plus ReportEvent (source=process)
  - event: LcInhibitEgo
    dtc: 0xC01C01
    debounce_count: 1
    fdc_threshold: 1
    aging_cycles: 40
  - event: LcInhibitSurround
    dtc: 0xC01C02
    debounce_count: 1
    fdc_threshold: 1
    aging_cycles: 40
  - event: LcInhibitRcm
    dtc: 0xC01C03
    debounce_count: 1
    fdc_threshold: 1
    aging_cycles: 40
  # Mapped for P3; corridor-only inhibit does not ReportEvent yet (expected stage).
  - event: LcInhibitCorridor
    dtc: 0xC01C04
    debounce_count: 1
    fdc_threshold: 1
    aging_cycles: 40
freeze_dids: []
