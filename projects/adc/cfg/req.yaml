schema_version: '0.1'
profile: vehicle-debug
variant: adc_drive_park
topology: ap_only
product: ADC
capabilities:
- front_camera
- surround_camera
- driving
- parking
runtime_modules:
- core
- com
- osal
- log
- exec
- phm
- sm
- collector
- ucm
- diag
- per
- tsync
bindings:
- iceoryx
observability:
  live_tap:
    enabled: true
    mode: wiring_all
  record:
    mode: minimal
    services:
    - services.semantic.EgoMotion
    - services.semantic.Perception_MESSAGE_Out_St
    - services.semantic.Trajectory
    - services.semantic.Freespace
    - services.semantic.FreespaceNear
    - services.semantic.VehicleMode
frame_ingest:
  frame_source: none
  pixel_format: nv12
  ego_source: carla
  frame_w: 2048
  frame_h: 1536
  camera_transport: shm
  active_source: isp
  # Cameras: front 3MP→FCM; fl/fr/rl/rr 1MP→surround; rear 2MP→rear感知(变道，另节点).
  camera_slots:
  - id: front
    w: 2048
    h: 1536
    pixel_format: nv12
    fps: 30
    mount:
      id: front
      x: 0.55
      y: 0.0
      z: 1.35
      pitch: -5.0
      yaw: 0.0
      roll: 0.0
      fov: 100.0
  - id: fl
    w: 1280
    h: 800
    pixel_format: nv12
    fps: 30
    mount:
      id: fl
      x: 1.05
      y: 1.05
      z: 1.05
      pitch: -12.0
      yaw: 90.0
      roll: 0.0
      fov: 90.0
  - id: fr
    w: 1280
    h: 800
    pixel_format: nv12
    fps: 30
    mount:
      id: fr
      x: 1.05
      y: -1.05
      z: 1.05
      pitch: -12.0
      yaw: -90.0
      roll: 0.0
      fov: 90.0
  - id: rl
    w: 1280
    h: 800
    pixel_format: nv12
    fps: 30
    mount:
      id: rl
      x: -0.60
      y: 1.00
      z: 1.00
      pitch: -15.0
      yaw: 135.0
      roll: 0.0
      fov: 90.0
  - id: rr
    w: 1280
    h: 800
    pixel_format: nv12
    fps: 30
    mount:
      id: rr
      x: -0.60
      y: -1.00
      z: 1.00
      pitch: -15.0
      yaw: -135.0
      roll: 0.0
      fov: 90.0
  - id: rear
    w: 1920
    h: 1080
    pixel_format: nv12
    fps: 30
    mount:
      id: rear
      x: -0.85
      y: 0.0
      z: 1.15
      pitch: -8.0
      yaw: 180.0
      roll: 0.0
      fov: 120.0
  bridge:
    enabled: true
  channels:
    vehicle_state: gf.channel.vehicle_state
    vehicle_cmd: gf.channel.vehicle_cmd
    fake_perc: gf.channel.fake_perc
    surround_world: gf.channel.surround_world
    rcm_truth: gf.channel.rcm_truth
apps:
- adapters/vehicle_can_gateway
- perception/fcm
- perception/surround
- perception/rcm
- planning/driving_plus
- planning/parking
- mode/drive_park
- frame_ingest
- frame_colorbar
- frame_replay
- carla_io
acceptance:
  description: ADC — Front+Surround
  lineage_required: false
  required_services:
  - services.semantic.EgoMotion
  - services.semantic.Perception_In_St
  - services.semantic.Perception_MESSAGE_Out_St
  - services.semantic.Perception_Rear_Out_St
  - services.semantic.Trajectory
  - services.semantic.VehicleBus
  - services.semantic.VehicleMode
publish_policy:
  services:
    EgoMotion:
      trigger: period
      period_ms: 10
    Perception_In_St:
      trigger: period
      period_ms: 10
    VehicleBus:
      trigger: period
      period_ms: 10
    Perception_MESSAGE_Out_St:
      trigger: on_change
      expect_fps: 20
    Perception_Rear_Out_St:
      trigger: on_change
      expect_fps: 20
    Trajectory:
      trigger: on_change
    VehicleMode:
      trigger: on_change
    SurroundWorld:
      trigger: on_change
    FreespaceNear:
      trigger: on_change
    Freespace:
      trigger: on_change
    ParkingTrajectory:
      trigger: on_change
  channels:
    vehicle_state:
      trigger: on_change
    vehicle_cmd:
      trigger: period
      period_ms: 10
    fake_perc:
      trigger: on_change
    surround_world:
      trigger: on_change
    rcm_truth:
      trigger: on_change
