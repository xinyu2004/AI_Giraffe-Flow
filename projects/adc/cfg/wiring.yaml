schema_version: '0.1'
project_id: adc
variant: adc_drive_park
modules:
- id: adapter.vehicle_can_gateway
- id: perception.fcm
  package: customer/fcm-perception
- id: perception.surround
- id: perception.rcm
- id: planning.driving_plus
  package: customer/planning-driving
- id: planning.parking
- id: mode.drive_park
deployments:
- process: external.vehicle_mcu
  compute_domain: external
  provides:
  - services.semantic.VehicleBus
  requires:
  - services.semantic.DrivingTrajectory
- process: adapter.vehicle_can_gateway
  compute_domain: ap_linux
  provides:
  - services.semantic.Perception_In_St
  - services.semantic.DrivingTrajectory
  - services.semantic.EgoMotion
  - services.semantic.ParkingSlot
  - services.semantic.ApaStatus
  requires:
  - services.semantic.VehicleBus
  - services.semantic.VehicleMode
  - services.semantic.DrivingTrajectory
  - services.semantic.ParkingTrajectory
- process: perception.fcm
  compute_domain: ap_linux
  provides:
  - services.semantic.Perception_MESSAGE_Out_St
  requires:
  - services.semantic.Perception_In_St
  - services.semantic.EgoMotion
- process: perception.surround
  compute_domain: ap_linux
  provides:
  - services.semantic.SurroundWorld
  - services.semantic.FreespaceNear
  requires:
  - services.semantic.EgoMotion
- process: perception.rcm
  compute_domain: ap_linux
  provides:
  - services.semantic.Perception_Rear_Out_St
  requires:
  - services.semantic.EgoMotion
- process: planning.driving_plus
  compute_domain: ap_linux
  provides:
  - services.semantic.DrivingTrajectory
  - services.semantic.Freespace
  requires:
  - services.semantic.EgoMotion
  - services.semantic.SurroundWorld
  - services.semantic.FreespaceNear
  - services.semantic.Perception_MESSAGE_Out_St
  - services.semantic.Perception_Rear_Out_St
- process: planning.parking
  compute_domain: ap_linux
  provides:
  - services.semantic.ParkingTrajectory
  requires:
  - services.semantic.SurroundWorld
  - services.semantic.FreespaceNear
  - services.semantic.ParkingSlot
- process: mode.drive_park
  compute_domain: ap_linux
  provides:
  - services.semantic.VehicleMode
  requires:
  - services.semantic.ApaStatus
  - services.semantic.EgoMotion
bindings:
- module: adapter.vehicle_can_gateway
  inputs:
  - service: semantic.VehicleBus
    type: VehicleBus
  - service: semantic.DrivingTrajectory
    type: DrivingTrajectory
  - service: semantic.VehicleMode
    type: VehicleMode
  - service: semantic.ParkingTrajectory
    type: ParkingTrajectory
  outputs:
  - service: semantic.EgoMotion
    type: EgoMotion
  - service: semantic.Perception_In_St
    type: Perception_In_St
  - service: semantic.DrivingTrajectory
    type: DrivingTrajectory
  - service: semantic.ParkingSlot
    type: ParkingSlot
  - service: semantic.ApaStatus
    type: ApaStatus
- module: perception.fcm
  inputs:
  - service: semantic.Perception_In_St
    type: Perception_In_St
  - service: semantic.EgoMotion
    type: EgoMotion
  outputs:
  - service: semantic.Perception_MESSAGE_Out_St
    type: Perception_MESSAGE_Out_St
- module: perception.surround
  inputs:
  - service: semantic.EgoMotion
    type: EgoMotion
  outputs:
  - service: semantic.SurroundWorld
    type: SurroundWorld
  - service: semantic.FreespaceNear
    type: FreespaceNear
- module: perception.rcm
  inputs:
  - service: semantic.EgoMotion
    type: EgoMotion
  outputs:
  - service: semantic.Perception_Rear_Out_St
    type: Perception_Rear_Out_St
- module: planning.driving_plus
  inputs:
  - service: semantic.Perception_MESSAGE_Out_St
    type: Perception_MESSAGE_Out_St
  - service: semantic.EgoMotion
    type: EgoMotion
  - service: semantic.FreespaceNear
    type: FreespaceNear
  - service: semantic.SurroundWorld
    type: SurroundWorld
  - service: semantic.Perception_Rear_Out_St
    type: Perception_Rear_Out_St
  outputs:
  - service: semantic.DrivingTrajectory
    type: DrivingTrajectory
  - service: semantic.Freespace
    type: Freespace
- module: planning.parking
  inputs:
  - service: semantic.SurroundWorld
    type: SurroundWorld
  - service: semantic.FreespaceNear
    type: FreespaceNear
  - service: semantic.ParkingSlot
    type: ParkingSlot
  outputs:
  - service: semantic.ParkingTrajectory
    type: ParkingTrajectory
- module: mode.drive_park
  inputs:
  - service: semantic.EgoMotion
    type: EgoMotion
  - service: semantic.ApaStatus
    type: ApaStatus
  outputs:
  - service: semantic.VehicleMode
    type: VehicleMode
dataflows:
- from: external.vehicle_mcu
  service: services.semantic.VehicleBus
  to: adapter.vehicle_can_gateway
- from: adapter.vehicle_can_gateway
  service: services.semantic.Perception_In_St
  to: perception.fcm
- from: adapter.vehicle_can_gateway
  service: services.semantic.EgoMotion
  to: perception.fcm
- from: perception.fcm
  service: services.semantic.Perception_MESSAGE_Out_St
  to: planning.driving_plus
- from: adapter.vehicle_can_gateway
  service: services.semantic.EgoMotion
  to: planning.driving_plus
- from: adapter.vehicle_can_gateway
  service: services.semantic.EgoMotion
  to: mode.drive_park
- from: adapter.vehicle_can_gateway
  service: services.semantic.EgoMotion
  to: perception.surround
- from: adapter.vehicle_can_gateway
  service: services.semantic.EgoMotion
  to: perception.rcm
- from: mode.drive_park
  service: services.semantic.VehicleMode
  to: adapter.vehicle_can_gateway
- from: adapter.vehicle_can_gateway
  service: services.semantic.ParkingSlot
  to: planning.parking
- from: adapter.vehicle_can_gateway
  service: services.semantic.ApaStatus
  to: mode.drive_park
- from: perception.surround
  service: services.semantic.FreespaceNear
  to: planning.driving_plus
- from: perception.surround
  service: services.semantic.FreespaceNear
  to: planning.parking
- from: perception.surround
  service: services.semantic.SurroundWorld
  to: planning.driving_plus
- from: perception.surround
  service: services.semantic.SurroundWorld
  to: planning.parking
- from: perception.rcm
  service: services.semantic.Perception_Rear_Out_St
  to: planning.driving_plus
- from: planning.driving_plus
  service: services.semantic.DrivingTrajectory
  to: adapter.vehicle_can_gateway
- from: planning.parking
  service: services.semantic.ParkingTrajectory
  to: adapter.vehicle_can_gateway
- from: adapter.vehicle_can_gateway
  service: services.semantic.DrivingTrajectory
  to: external.vehicle_mcu
channel_flows:
- from: host.frame_ingest
  to: perception.fcm
  kind: gf_channel
  slot: gf.channel.front
- from: host.frame_ingest
  to: perception.surround
  kind: gf_channel
  slot: gf.channel.fl
- from: host.frame_ingest
  to: perception.surround
  kind: gf_channel
  slot: gf.channel.fr
- from: host.frame_ingest
  to: perception.surround
  kind: gf_channel
  slot: gf.channel.rl
- from: host.frame_ingest
  to: perception.surround
  kind: gf_channel
  slot: gf.channel.rr
- from: host.frame_ingest
  to: perception.rcm
  kind: gf_channel
  slot: gf.channel.rear
canvas:
  nodes:
    host.frame_ingest:
      kind: frame_ingest
      label: frame_ingest
      x: 12130.6
      y: -759.3
      out_side: right
      in_side: left
      port_slot_order:
        right:
        - out:gf.channel.rear
        left:
        - out:gf.channel.fl
        - out:gf.channel.fr
        - out:gf.channel.rl
        - out:gf.channel.rr
        bottom:
        - out:gf.channel.front
      port_sides:
        out:gf.channel.fl: left
        out:gf.channel.fr: left
        out:gf.channel.rl: left
        out:gf.channel.rr: left
        out:gf.channel.rear: right
        out:gf.channel.front: bottom
      color: '#aaffff'
      color_user: true
    external.vehicle_mcu: {}
    adapter.vehicle_can_gateway:
      x: 11203.8
      y: -143.2
      out_side: right
      in_side: left
      port_sides:
        out:EgoMotion: right
        out:ParkingSlot: right
        out:ApaStatus: right
        in:ParkingTrajectory: bottom
        in:VehicleMode: bottom
        in:DrivingTrajectory: bottom
        in:VehicleBus: top
      port_slot_order:
        bottom:
        - in:VehicleMode
        - in:DrivingTrajectory
        - in:ParkingTrajectory
        top:
        - in:VehicleBus
        right:
        - out:Perception_In_St
        - out:DrivingTrajectory
        - out:EgoMotion
        - out:ParkingSlot
        - out:ApaStatus
      color: '#f1c40f'
    perception.fcm:
      x: 12105.8
      y: -469.8
      out_side: right
      in_side: left
      port_sides:
        in:gf.channel.front: top
        in:EgoMotion: left
        in:Perception_In_St: left
        out:Perception_MESSAGE_Out_St: bottom
      port_slot_order:
        left:
        - in:Perception_In_St
        - in:EgoMotion
        bottom:
        - out:Perception_MESSAGE_Out_St
        top:
        - in:gf.channel.front
      color: '#8bc34a'
    perception.surround:
      x: 11765.6
      y: -572.2
      out_side: right
      in_side: left
      port_sides:
        in:gf.channel.fl: top
        in:gf.channel.fr: top
        in:gf.channel.rl: top
        in:gf.channel.rr: top
        out:SurroundWorld: bottom
        out:FreespaceNear: bottom
      port_slot_order:
        left:
        - in:EgoMotion
        bottom:
        - out:SurroundWorld
        - out:FreespaceNear
        top:
        - in:gf.channel.fl
        - in:gf.channel.fr
        - in:gf.channel.rl
        - in:gf.channel.rr
      color: '#3498db'
    perception.rcm:
      x: 12417.3
      y: -359.1
      out_side: right
      in_side: left
      port_sides:
        in:gf.channel.rear: top
        in:EgoMotion: left
        out:Perception_Rear_Out_St: bottom
      port_slot_order:
        left:
        - in:EgoMotion
        top:
        - in:gf.channel.rear
        bottom:
        - out:Perception_Rear_Out_St
      color: '#16a085'
    planning.driving_plus:
      x: 12263.1
      y: 66.7
      out_side: right
      in_side: left
      port_sides:
        in:Perception_MESSAGE_Out_St: top
        in:FreespaceNear: top
        in:SurroundWorld: top
        in:Perception_Rear_Out_St: top
        out:DrivingTrajectory: bottom
        out:Freespace: bottom
      port_slot_order:
        left:
        - in:EgoMotion
        bottom:
        - out:DrivingTrajectory
        - out:Freespace
        top:
        - in:SurroundWorld
        - in:FreespaceNear
        - in:Perception_MESSAGE_Out_St
        - in:Perception_Rear_Out_St
      color: '#9b59b6'
    planning.parking:
      x: 11876.7
      y: -120.9
      out_side: right
      in_side: left
      port_sides:
        out:ParkingTrajectory: bottom
        in:SurroundWorld: top
        in:FreespaceNear: top
        in:ParkingSlot: left
      port_slot_order:
        left:
        - in:ParkingSlot
        top:
        - in:SurroundWorld
        - in:FreespaceNear
        bottom:
        - out:ParkingTrajectory
      color: '#e91e63'
    mode.drive_park:
      x: 11957.0
      y: 432.2
      out_side: right
      in_side: left
      port_sides:
        out:VehicleMode: left
        in:EgoMotion: top
        in:ApaStatus: top
      port_slot_order:
        top:
        - in:ApaStatus
        - in:EgoMotion
        left:
        - out:VehicleMode
      color: '#1abc9c'
  edge_label_font_pt: 13
