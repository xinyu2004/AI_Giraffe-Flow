# compose 入口 — OEM A / AFC 前视（有 USS）
schema_version: "0.1"
project_id: afc_with_uss
customer_id: oem_a
product: AFC

base: schemas/examples/desktop_ap_only.sor.json
out: gf.sor.json

oem:
  dbc: oem/oem_import.dbc
  manifest: oem/oem_import.yaml

integration:
  wiring: integration/wiring.yaml

# ③ 平台清单 — 见 MIDDLEWARE_CONFIG_PLAN
#   exec = FG/拓扑；em_launch = OS EM 二进制表；phm = Alive/on_failure；collector = Event 最小集
platform:
  exec: platform/exec.yaml
  em_launch: platform/em_launch.yaml
  phm: platform/phm.yaml
  diag: platform/diag.yaml
  log: platform/log.yaml
  ucm: platform/ucm.yaml
  collector: platform/collector.yaml

delivery:
  req: req.yaml

lineage:
  report: reports/signal_lineage_report.yaml
  fail_on_error: true
