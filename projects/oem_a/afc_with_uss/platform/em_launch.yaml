# OS EM launch map — binaries relative to $GF_BUILD_DIR (= runtime/ on board).
schema_version: "0.1"
processes:
  - name: host.dlt_daemon
    binary: bin/dlt-daemon
    args: []
    max_restarts: 3
  - name: host.iox_roudi
    binary: bin/iox-roudi
    args: ["-c", "$GF_IOX_TOML"]
    max_restarts: 3
  - name: adapter.vehicle_can_gateway
    binary: bin/gf_vehicle_can_gateway
    args: ["0"]
    max_restarts: 3
  - name: sensing.uss
    binary: bin/gf_sensing_uss
    args: ["0"]
    max_restarts: 3
  - name: perception.fcm
    binary: bin/gf_perception_fcm
    args: ["0"]
    max_restarts: 3
  - name: planning.driving
    binary: bin/gf_planning_driving
    args: ["0"]
    max_restarts: 2
