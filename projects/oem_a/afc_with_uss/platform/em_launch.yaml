# OS EM launch map — binaries relative to $GF_BUILD_DIR
# args / max_restarts: always explicit (no omitted fields).
# gateway argv[1] = max Trajectory samples before exit (15 ≈ SIL smoke; 0 = run forever).
# other apps ignore argv today — still write ["0"] so the table is never blank.
schema_version: "0.1"
processes:
  - name: adapter.vehicle_can_gateway
    binary: apps/adapters/vehicle_can_gateway/gf_vehicle_can_gateway
    args: ["15"]
    max_restarts: 3
  - name: perception.fcm
    binary: apps/perception/fcm/gf_perception_fcm
    args: ["0"]
    max_restarts: 3
  - name: sensing.uss
    binary: apps/sensing/uss/gf_sensing_uss
    args: ["0"]
    max_restarts: 3
  - name: planning.driving
    binary: apps/planning/driving/gf_planning_driving
    args: ["0"]
    max_restarts: 2
