# exec + SM — EM entry; optional host.dlt / host.iox_roudi are EM-managed daemons.
# Product freeze → generated/exec.yaml (compose).
schema_version: "0.1"
function_groups:
  - id: MachineFG
    initial: Running
processes:
  - name: host.dlt_daemon
    function_group: MachineFG
    depends_on: []
    execution_client: false
  - name: host.iox_roudi
    function_group: MachineFG
    depends_on:
      - host.dlt_daemon
    execution_client: false
  - name: adapter.vehicle_can_gateway
    function_group: MachineFG
    depends_on:
      - host.iox_roudi
    execution_client: true
  - name: perception.fcm
    function_group: MachineFG
    depends_on:
      - adapter.vehicle_can_gateway
    execution_client: true
  - name: sensing.uss
    function_group: MachineFG
    depends_on:
      - adapter.vehicle_can_gateway
    execution_client: true
  - name: planning.driving
    function_group: MachineFG
    depends_on:
      - perception.fcm
      - sensing.uss
    execution_client: true
