# OS EM launch map — binaries relative to $GF_BUILD_DIR (= runtime/ on board).
# Product freeze (compose → generated/em_launch.yaml) forces gateway args ["0"].
# host.frame_ingest: kept when req.frame_ingest frame source enabled (compose filter).
schema_version: "0.1"
processes:
  - name: host.dlt_daemon
    binary: bin/dlt-daemon
    args: []
    max_restarts: 3
  - name: host.iox_roudi
    binary: bin/iox-roudi
    args: ["-c", "$GF_IOX_TOML"]
    max_restarts: 3
  - name: host.frame_ingest
    binary: bin/gf_frame_ingest
    args: []
    max_restarts: 3
  - name: adapter.vehicle_can_gateway
    binary: bin/gf_vehicle_can_gateway
    args: ["0"]
    max_restarts: 3
  - name: perception.fcm
    binary: bin/gf_perception_fcm
    args: ["0"]
    max_restarts: 3
  - name: planning.driving
    binary: bin/gf_planning_driving
    args: ["0"]
    max_restarts: 2
