# exec + SM（function_groups → middleware/sm StateClient）
# EM entry. Optional host.dlt_daemon / host.iox_roudi are EM-managed daemons
# when enabled by compose (log sinks / iceoryx bindings). Authoring source for gf-config;
# product freeze → generated/exec.yaml.
schema_version: "0.1"
function_groups:
  - id: MachineFG
    initial: Running
processes:
  - name: host.dlt_daemon
    function_group: MachineFG
    depends_on: []
    execution_client: false
  - name: host.iox_roudi
    function_group: MachineFG
    depends_on:
      - host.dlt_daemon
    execution_client: false
  - name: adapter.vehicle_can_gateway
    function_group: MachineFG
    depends_on:
      - host.iox_roudi
    execution_client: true
  - name: perception.fcm
    function_group: MachineFG
    depends_on:
      - adapter.vehicle_can_gateway
    execution_client: true
  - name: planning.driving
    function_group: MachineFG
    depends_on:
      - perception.fcm
    execution_client: true
